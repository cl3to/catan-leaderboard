services:
  db:
    image: postgres:16-alpine
    container_name: catan-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catan}
      POSTGRES_USER: ${POSTGRES_USER:-catan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catan123}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catan}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - catan-network

  migrate:
    build:
      context: ./apps/api
    container_name: catan-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catan}:${POSTGRES_PASSWORD:-catan123}@db:5432/${POSTGRES_DB:-catan}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-admin}
      BOT_DEFAULT_TOKEN: ${BOT_DEFAULT_TOKEN:-default-bot-token}
    command: >
      sh -c "npx prisma migrate deploy"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catan-network
    profiles:
      - migrate

  api:
    build:
      context: ./apps/api
    container_name: catan-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-catan}:${POSTGRES_PASSWORD:-catan123}@db:5432/${POSTGRES_DB:-catan}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      FRONTEND_URL: http://web:3000
      UPLOAD_DIR: /app/uploads
      BOT_DEFAULT_TOKEN: ${BOT_DEFAULT_TOKEN:-default-bot-token-change-this}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-admin}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catan-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./apps/web
    container_name: catan-web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NESTJS_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-nextauth-secret-change-this}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - catan-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://web:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  uploads:

networks:
  catan-network:
    driver: bridge
