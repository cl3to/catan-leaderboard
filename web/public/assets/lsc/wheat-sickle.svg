  <g fill="#D9A92C">
    <use href="#ear2" transform="translate(50,30)"/>
    <use href="#ear2" transform="translate(46,38) rotate(-14) scale(0.9)"/>
    <use href="#ear2" transform="translate(54,38) rotate(14) scale(0.9)"/>
